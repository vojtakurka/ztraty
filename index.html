<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tepelné ztráty místnosti VK</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d8dce3;--ac:#d9480f;--grid:#e6e9ee;--fill:rgba(217,72,15,.08);--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mut:#9aa3b2;--bd:#323844;--ac:#ff8a4c;--grid:#262b33;--fill:rgba(255,138,76,.1);--in:#14171c}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mut:#9aa3b2;--bd:#323844;--ac:#ff8a4c;--grid:#262b33;--fill:rgba(255,138,76,.1);--in:#14171c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:17px;margin:0}header small{color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:12px;padding:12px;max-width:1400px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px;flex:1;min-width:70px}
input,select{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:6px;width:100%;min-width:0}
input:disabled{opacity:.6}
input[type=checkbox]{width:auto}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--tx)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
svg{width:100%;height:460px;background:var(--card);border:1px solid var(--bd);border-radius:10px;touch-action:none;display:block}
#st{color:var(--mut);font-size:12px;margin-top:6px;min-height:34px}
.op{border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-size:12px}
tfoot td{font-weight:700;border-top:2px solid var(--bd)}
.op-r td{font-style:italic}.sel-r td{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sum div{background:var(--bg);border-radius:8px;padding:10px}.sum span{display:block;color:var(--mut);font-size:12px}
.sum b{font-size:20px}.sum .big b{color:var(--ac);font-size:26px}
.warn{color:#d92d20;font-size:12px}
@keyframes glow{0%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 14px 2px color-mix(in srgb,var(--ac) 45%,transparent);border-color:var(--ac)}100%{box-shadow:0 0 0 0 transparent}}.flash{animation:glow 1.1s ease-out}
.cz{position:absolute;top:8px;left:8px;display:flex;gap:4px}.cz button{opacity:.92}
.ti{width:88px;text-align:right;padding:3px 4px}
.nm{cursor:pointer}.nm:hover{color:var(--ac)}
</style></head><body>
<header><h1>Tepelné ztráty místnosti VK <small>v0.1.1 · poslední aktualizace 23. 10. 2026</small></h1></header>
<main>
<aside id="side"></aside>
<section>
<div class="card">
<div class="tb">
<button id="bOrtho" onclick="tg('ortho')">Ortho</button><button id="bSnap" onclick="tg('snap')">Snap</button>
<select id="grid" onchange="S.grid=+this.value;draw()" style="width:auto"><option value="0.05">Rastr 0,05 m</option><option value="0.1" selected>Rastr 0,1 m</option><option value="0.25">Rastr 0,25 m</option><option value="0.5">Rastr 0,5 m</option><option value="1">Rastr 1 m</option></select>
<button class="p" onclick="closePoly()">Uzavřít obvod (C)</button>
<button onclick="rect()">Ukázka 5×4 m</button><button onclick="resetAll()">Nový půdorys</button>
</div>
<div style="position:relative"><svg id="svg"></svg><div class="cz"><button onclick="undo()">Zpět</button><button onclick="zoom(.8)">－</button><button onclick="zoom(1.25)">＋</button></div></div>
<div id="st"></div>
</div>
<div class="card"><h2>Tabulka konstrukcí</h2><div class="tb" id="expb"><button onclick="doExp('csv')">Export CSV</button><button onclick="doExp('pdf')">Export PDF</button></div><div class="tw" id="tbl"></div></div>
<div class="card"><h2>Souhrn</h2><div class="sum" id="sum"></div></div>
</section></main>
<script>
const S={G:{ti:20,te:-12,h:2.6},pts:[],closed:false,walls:[],sel:-1,
floor:{lock:true,A:0,mode:'custom',tx:20,U:.3},ceil:{lock:true,A:0,mode:'custom',tx:20,U:.2},
vent:{mode:'n',V:30,n:.5,tsuMode:'te',tsu:15},view:{sc:60,ox:70,oy:50},grid:.1,ortho:true,snap:true,buf:'',cur:null,room:{num:'',name:''}};
const $=id=>document.getElementById(id),svg=$('svg');
const f=(x,d=2)=>(+x).toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d});
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const setv=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v};
const N=(p,v,el)=>{v=parseFloat(String(v).replace(',','.'));if(isNaN(v))v=0;if(v<0&&/\.(w|h|n|U|V|A)$/.test(p)){v=0;if(el)el.value=0}setv(p,v);update()};
const B=(p,v)=>{setv(p,v);side();update()};
const M=(p,v)=>{setv(p,v);const o=get(p.replace(/\.mode$/,''));if(v==='20')o.tx=20;if(v==='10')o.tx=10;side();update()};
const eff=o=>o.mode==='te'?S.G.te:o.tx;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const polyS=()=>{let s=0,n=S.pts.length;for(let i=0;i<n;i++){const a=S.pts[i],b=S.pts[(i+1)%n];s+=a.x*b.y-b.x*a.y}return s/2};
const area=()=>S.closed?Math.abs(polyS()):0;
const Aof=o=>o.lock?area():o.A;
const L=i=>dist(S.pts[i],S.pts[(i+1)%S.pts.length]);
const r6=v=>Math.round(v*1e6)/1e6;
/* ---------- panels ---------- */
const inp=(p,l,dis)=>{const st=/\.U$/.test(p)?.01:/ops\.\d+\.n$/.test(p)?1:/\.(w|h|n|A)$/.test(p)?.1:'any',mn=/\.(w|h|n|U|V|A)$/.test(p)?'min="0"':'';return `<label>${l}<input type="number" step="${st}" ${mn} value="${get(p)}" ${dis?'disabled':''} oninput="N('${p}',this.value,this)"></label>`};
const txc=(p,l)=>{const o=get(p),m=o.mode;return `<label>${l}<select onchange="M('${p}.mode',this.value)">${[['te','Venkovní tₑ'],['20','Vytápěný soused 20 °C'],['10','Nevytápěná chodba 10 °C'],['custom','Vlastní']].map(([v,t])=>`<option value="${v}" ${m===v?'selected':''}>${t}</option>`).join('')}</select></label>`+(m==='custom'?inp(p+'.tx','t [°C]'):`<label>t [°C]<b data-tx="${p}" style="padding:6px 0">${eff(o)}</b></label>`)};
function side(){
let h=`${roomCard()}<div class="card"><h2>Globální parametry</h2><div class="row">${inp('G.ti','tᵢ [°C]')}${inp('G.te','tₑ [°C]')}${inp('G.h','h [m]')}</div></div>`;
if(S.closed&&S.sel>=0){const w=S.walls[S.sel],p='walls.'+S.sel,c={};
h+=`<div class="card${S.flash?' flash':''}"><h2>Stěna S${S.sel+1} · ${f(L(S.sel))} m</h2><div class="row">${txc(p,'Teplota za konstrukcí')}${inp(p+'.U','U [W/(m²·K)]')}</div>`;
w.ops.forEach((o,j)=>{c[o.type]=(c[o.type]||0)+1;const q=`${p}.ops.${j}`;
h+=`<div class="op"><div class="row"><b style="flex:1">${o.type} ${c[o.type]}</b><button onclick="delOp(${j})">✕</button></div><div class="row">${inp(q+'.w','šířka [m]')}${inp(q+'.h','výška [m]')}</div><div class="row" style="margin-top:6px">${inp(q+'.n','ks')}${inp(q+'.U','U otvoru')}</div></div>`});
h+=`<div class="row" style="margin-top:10px"><button onclick="addOp('Okno')">+ Přidat okno</button><button onclick="addOp('Dveře')">+ Přidat dveře</button></div><div class="warn" id="ow"></div></div>`}
else h+=`<div class="card"><h2>Stěna</h2><span style="color:var(--mut)">${S.closed?'Klikni na stěnu v půdorysu.':'Nejdřív nakresli a uzavři půdorys. Pak klikni na stěnu pro její vlastnosti a otvory.'}</span></div>`;
const hz=(k,t,l)=>{const o=S[k];return `<div class="card"><h2>${t}</h2><label class="chk"><input type="checkbox" ${o.lock?'checked':''} onchange="B('${k}.lock',this.checked)">Plocha z geometrie</label><div class="row" style="margin-top:6px">${o.lock?`<label>A [m²]<b data-fa style="padding:6px 0">${f(area())}</b></label>`:inp(k+'.A','A [m²]')}${inp(k+'.U','U [W/(m²·K)]')}</div><div class="row" style="margin-top:6px">${txc(k,l)}</div></div>`};
h+=hz('floor','Podlaha','Teplota pod konstrukcí')+hz('ceil','Strop','Teplota nad konstrukcí');
const v=S.vent;
h+=`<div class="card"><h2>Větrání</h2><div class="row"><label>Zadání<select onchange="B('vent.mode',this.value)"><option value="V" ${v.mode==='V'?'selected':''}>Průtok V [m³/h]</option><option value="n" ${v.mode==='n'?'selected':''}>Intenzita n [h⁻¹]</option></select></label>${v.mode==='V'?inp('vent.V','V [m³/h]'):inp('vent.n','n [h⁻¹]')}</div><div class="row" style="margin-top:6px"><label class="chk"><input type="checkbox" ${v.tsuMode==='te'?'checked':''} onchange="B('vent.tsuMode',this.checked?'te':'c')">Venkovní vzduch</label>${v.tsuMode==='c'?inp('vent.tsu','tₛᵤ [°C]'):`<label>tₛᵤ [°C]<b data-tsu style="padding:6px 0">${S.G.te}</b></label>`}</div></div>`;
$('side').innerHTML=h;S.flash=0}
const addOp=t=>{S.walls[S.sel].ops.push(t==='Okno'?{type:t,w:1.2,h:1.5,n:1,U:1.1}:{type:t,w:.9,h:2,n:1,U:1.7});side();update()};
const delOp=j=>{S.walls[S.sel].ops.splice(j,1);side();update()};
/* ---------- výpočet ---------- */
function calc(){const {ti,h}=S.G,rows=[];let warn='';
S.walls.forEach((w,i)=>{const tx=eff(w),c={};let ao=0;
w.ops.forEach(o=>ao+=o.w*o.h*o.n);const g=L(i)*h;if(ao>g)warn=`Otvory ve stěně S${i+1} přesahují plochu stěny.`;
rows.push([`Stěna ${i+1}`,Math.max(0,g-ao),w.U,ti-tx,0,0,i,'walls.'+i+'.U','walls.'+i]);
w.ops.forEach((o,j)=>{c[o.type]=(c[o.type]||0)+1;rows.push([`${o.type} ${c[o.type]} ve Stěně ${i+1}${o.n>1?` (${o.n}×)`:''}`,o.w*o.h*o.n,o.U,ti-tx,0,1,i,'walls.'+i+'.ops.'+j+'.U','walls.'+i])})});
if(S.closed){rows.push(['Podlaha',Aof(S.floor),S.floor.U,ti-eff(S.floor),0,0,null,'floor.U','floor']);rows.push(['Strop',Aof(S.ceil),S.ceil.U,ti-eff(S.ceil),0,0,null,'ceil.U','ceil'])}
rows.forEach(r=>r[4]=r[1]*r[2]*r[3]);
const PT=rows.reduce((s,r)=>s+r[4],0),SA=rows.reduce((s,r)=>s+r[1],0),v=S.vent;
const Af=Aof(S.floor),V=v.mode==='V'?v.V:v.n*Af*h,tsu=v.tsuMode==='te'?S.G.te:v.tsu,PV=.34*V*(ti-tsu);
return{rows,PT,SA,V,PV,warn}}
function update(){const c=calc();
const key=c.rows.map(r=>r[0]+r[7]).join('|'),html=`<table><thead><tr><th>Konstrukce</th><th>A [m²]</th><th>U [W/(m²·K)]</th><th>t za konstrukcí [°C]</th><th>Δt [K]</th><th>Φ [W]</th></tr></thead><tbody>${c.rows.map(r=>`<tr class="${r[5]?'op-r ':''}${r[6]===S.sel?'sel-r':''}"><td${r[6]!==null?` class="nm" onclick="pick(${r[6]})"`:''}>${r[5]?'▫ ':''}${r[0]}</td><td>${f(r[1])}</td><td><input class="ti" type="number" step=".01" min="0" value="${r[2]}" oninput="TU('${r[7]}',this.value,this)"></td><td><input class="ti" type="number" step=".5" value="${r6(S.G.ti-r[3])}" oninput="TX('${r[8]}',this.value)"></td><td>${f(r[3],1)}</td><td>${f(r[4],1)}</td></tr>`).join('')||'<tr><td colspan=6 style="text-align:center;color:var(--mut)">Zatím žádné konstrukce</td></tr>'}</tbody><tfoot><tr><td>Součet</td><td>${f(c.SA)}</td><td></td><td></td><td></td><td>${f(c.PT,1)}</td></tr></tfoot></table>`;tblRender(key,html,c);
const T=c.PT+c.PV;
$('sum').innerHTML=`<div><span>Prostup Φ_T</span><b>${f(c.PT,0)} W</b></div><div><span>Větrání Φ_V (V = ${f(c.V,1)} m³/h)</span><b>${f(c.PV,0)} W</b></div><div class="big"><span>Celkem Φ_celkem</span><b>${f(T,0)} W</b><span>${f(T/1000,2)} kW</span></div>`;
document.querySelectorAll('[data-tx]').forEach(e=>e.textContent=eff(get(e.dataset.tx)));
document.querySelectorAll('[data-tsu]').forEach(e=>e.textContent=S.G.te);
document.querySelectorAll('[data-fa]').forEach(e=>e.textContent=f(area()));
const w=$('ow');if(w)w.textContent=c.warn;draw()}
/* ---------- CAD ---------- */
const X=x=>(S.view.ox+x*S.view.sc).toFixed(1),Y=y=>(S.view.oy+y*S.view.sc).toFixed(1);
const sn=v=>S.snap?Math.round(v/S.grid)*S.grid:v;
function dirU(l){const dx=S.cur.x-l.x,dy=S.cur.y-l.y;if(S.ortho)return Math.abs(dx)>=Math.abs(dy)?{x:dx<0?-1:1,y:0}:{x:0,y:dy<0?-1:1};const m=Math.hypot(dx,dy);return m?{x:dx/m,y:dy/m}:{x:1,y:0}}
function pv(){if(!S.cur)return null;let p={x:sn(S.cur.x),y:sn(S.cur.y)};const l=S.pts[S.pts.length-1];
if(l){if(S.ortho){Math.abs(S.cur.x-l.x)>=Math.abs(S.cur.y-l.y)?p.y=l.y:p.x=l.x}
const q=parseFloat(S.buf.replace(',','.'));if(S.buf&&q>0){const u=dirU(l);p={x:l.x+u.x*q,y:l.y+u.y*q}}}
return{x:r6(p.x),y:r6(p.y)}}
function opn(i,a,dx,dy,l,sg){const ops=S.walls[i].ops,G=.15,pc=[];ops.forEach(o=>{for(let j=0;j<o.n;j++)pc.push(o)});if(!pc.length)return'';
const tot=pc.reduce((t,o)=>t+o.w,0)+G*(pc.length-1),k=Math.min(1,l/tot);let s=(l-tot*k)/2,r='';
pc.forEach(o=>{const w=o.w*k,x1=+X(a.x+dx*s),y1=+Y(a.y+dy*s),x2=+X(a.x+dx*(s+w)),y2=+Y(a.y+dy*(s+w)),q=`x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"`;s+=w+G*k;
r+=`<g style="pointer-events:none"><line ${q} stroke="var(--card)" stroke-width="7"/>`;
if(o.type==='Okno')r+=`<line ${q} stroke="var(--tx)" stroke-width="1.5"/>`;
else{const R=w*S.view.sc,ex=(x1-dy*sg*R).toFixed(1),ey=(y1+dx*sg*R).toFixed(1);r+=`<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="var(--tx)" stroke-width="1.5"/><path d="M${x2} ${y2}A${R} ${R} 0 0 ${sg>0?1:0} ${ex} ${ey}" fill="none" stroke="var(--tx)" stroke-width="1" opacity=".6"/>`}
r+='</g>'});return r}
function draw(){const r=svg.getBoundingClientRect(),W=r.width,H=r.height,{sc,ox,oy}=S.view;
let g=S.grid;while(g*sc<10)g*=2;let d='';
for(let x=Math.ceil(-ox/sc/g)*g;x<=(W-ox)/sc;x+=g)d+=`M${X(x)} 0V${H}`;
for(let y=Math.ceil(-oy/sc/g)*g;y<=(H-oy)/sc;y+=g)d+=`M0 ${Y(y)}H${W}`;
let h=`<path d="${d}" stroke="var(--grid)" fill="none"/><path d="M${X(0)-8} ${Y(0)}h16M${X(0)} ${Y(0)-8}v16" stroke="var(--mut)"/>`;
const P=S.pts,n=P.length,t=(x,y,s,c='var(--tx)',w=12)=>`<text x="${x}" y="${y}" font-size="${w}" fill="${c}" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:var(--card);stroke-width:3px;pointer-events:none">${s}</text>`;
if(S.closed){const s=polyS()>0?1:-1;
h+=`<polygon points="${P.map(p=>X(p.x)+','+Y(p.y)).join(' ')}" fill="var(--fill)"/>`;
let cx=0,cy=0;P.forEach(p=>{cx+=p.x/n;cy+=p.y/n});
h+=t(X(cx),Y(cy),`A = ${f(area())} m²`,'var(--ac)',14);
P.forEach((a,i)=>{const b=P[(i+1)%n],x1=X(a.x),y1=Y(a.y),x2=X(b.x),y2=Y(b.y),sel=i===S.sel,l=L(i),dx=(b.x-a.x)/l,dy=(b.y-a.y)/l;
h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${sel?'var(--ac)':'var(--tx)'}" stroke-width="${sel?5:3}" stroke-linecap="round"/><line data-w="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="18" style="cursor:pointer"/>`;
h+=opn(i,a,dx,dy,l,s);h+=t((+x1+ +x2)/2+dy*s*22,(+y1+ +y2)/2-dx*s*22,`S${i+1} · ${f(l)} m`,sel?'var(--ac)':'var(--tx)')});
P.forEach(p=>h+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="var(--tx)"/>`)}
else{if(n>1)h+=`<polyline points="${P.map(p=>X(p.x)+','+Y(p.y)).join(' ')}" fill="none" stroke="var(--tx)" stroke-width="3"/>`;
P.forEach((p,i)=>h+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i?4:6}" fill="${i?'var(--tx)':'var(--ac)'}"/>`);
const p=pv(),l=P[n-1];
if(p){if(l){h+=`<line x1="${X(l.x)}" y1="${Y(l.y)}" x2="${X(p.x)}" y2="${Y(p.y)}" stroke="var(--ac)" stroke-width="2" stroke-dasharray="6 4"/>`+t((+X(l.x)+ +X(p.x))/2,(+Y(l.y)+ +Y(p.y))/2-14,f(dist(l,p))+' m','var(--ac)',13)}
h+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="none" stroke="var(--ac)" stroke-width="2"/>`}}
svg.innerHTML=h;
$('bOrtho').className=S.ortho?'on':'';$('bSnap').className=S.snap?'on':'';
$('st').textContent=S.closed?'Klikni na stěnu pro úpravu vlastností a otvorů. Plocha podlahy: '+f(area())+' m².':
`Klik = bod · napiš délku (m) + Enter${S.buf?' – zadáváš: '+S.buf+' m':''} · C = uzavřít (nebo klik na první bod) · Backspace = zpět · kolečko = zoom · Shift+tažení = posun`}
const tg=k=>{S[k]=!S[k];draw()};
const zoom=k=>{S.view.sc=Math.min(400,Math.max(10,S.view.sc*k));draw()};
function closePoly(){if(S.closed||S.pts.length<3)return;S.closed=true;S.walls=S.pts.map(()=>({mode:'custom',tx:20,U:.3,ops:[]}));S.sel=0;side();update()}
function undo(){if(S.closed){S.closed=false;S.walls=[];S.sel=-1}else S.pts.pop();S.buf='';side();update()}
function resetAll(){S.pts=[];S.closed=false;S.walls=[];S.sel=-1;S.buf='';side();update()}
function rect(){resetAll();S.pts=[{x:0,y:0},{x:5,y:0},{x:5,y:4},{x:0,y:4}];closePoly()}
function mpos(e){const r=svg.getBoundingClientRect();return{mx:e.clientX-r.left,my:e.clientY-r.top}}
let pan=null,moved=false;
